<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LWH Hub</title>
  <meta name="description" content="Logistics Warehouse — every company app, site and tool in one place.">
  <meta name="theme-color" content="#C41230">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/hub-favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/hub-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LWH Hub">
  <link rel="preload" href="assets/fonts/oswald-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/theme.css?v=1.2.0">
  <style>
    .hub-top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; margin-bottom: 22px; align-items: stretch; }
    .hub-hello h1 { font-family: var(--head); font-weight: 700; font-size: 34px; text-transform: uppercase; line-height: 1.05; }
    .hub-hello .when { color: var(--ink-2); margin-top: 6px; font-size: 15px; }
    .hub-hello .clock { font-family: var(--head); font-weight: 600; font-size: 20px; color: var(--red); margin-top: 2px; }
    .search { position: relative; margin-top: 16px; }
    .search input { padding-left: 44px; font-size: 16px; height: 50px; }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
    .hub-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .sec-title { font-family: var(--head); font-weight: 600; font-size: 18px; text-transform: uppercase; letter-spacing: .6px; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
    .sec-title::after { content: ''; flex: 1; height: 2px; background: var(--line); }
    .sec-title .n { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
    .tiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .ht { position: relative; display: flex; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--red); padding: 14px 40px 14px 14px; text-decoration: none; color: var(--ink); min-height: 86px; transition: border-color .15s, transform .15s, box-shadow .15s; }
    .ht:hover { border-color: #cfcfcf; border-left-color: var(--red); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    .ht.mgr { border-left-color: var(--black); }
    .ht.cust { border-left-color: var(--blue); }
    .ht.tr { border-left-color: #7A0C1E; }
    .ht.off { border-left-color: #E39400; }
    .ht .ic { width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center; font-size: 22px; background: var(--page); }
    .ht b { display: block; font-family: var(--head); font-weight: 600; font-size: 16.5px; letter-spacing: .2px; line-height: 1.2; }
    .ht .d { display: block; font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
    .ht .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
    .ht .dom { font-size: 11.5px; color: var(--muted); }
    .pill { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 2px 7px; white-space: nowrap; }
    .pill.app { background: var(--black); color: #fff; }
    .pill.site { background: #E8F0FA; color: var(--blue); }
    .pill.doc { background: #FFF3DF; color: #8A5300; }
    .pill.link { background: var(--gray-tint); color: var(--ink-2); }
    .grp { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 14px 0 10px; }
    .grp-l { font-family: var(--head); font-weight: 600; font-size: 14px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink); }
    .grp-s { font-size: 12.5px; color: var(--muted); }
    .how { background: none; border: 0; color: var(--red); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }
    .star { position: absolute; top: 8px; right: 8px; background: none; border: 0; cursor: pointer; font-size: 18px; line-height: 1; color: #C9C9C9; padding: 4px; }
    .star.on { color: #F5B700; }
    .star:hover { color: #F5B700; }
    .fav-empty { color: var(--muted); font-size: 14px; padding: 6px 0 2px; }
    .hint-key { font-size: 12.5px; color: var(--muted); }
    @media (max-width: 860px) { .hub-top { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 720px) { .hub-hello h1 { font-size: 26px; } .tiles-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; } .ht { min-height: 0; } }
  </style>
</head>
<body>
  <div class="utility" id="utility"></div>
  <header class="brandbar" id="brandbar"></header>

  <main class="wrap">
    <div class="hub-top">
      <div class="hub-hello">
        <h1 id="hello">Good morning</h1>
        <div class="when" id="when"></div>
        <div class="clock" id="clock"></div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="q" type="search" placeholder="Search apps, sites and sheets…  ( / )" autocomplete="off" aria-label="Search">
        </div>
      </div>
      <div class="card" style="margin:0">
        <div class="card-head"><h2>Current Conditions</h2></div>
        <div class="card-body" id="wxBox"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
      </div>
    </div>

    <div class="hub-bar">
      <div class="chips" id="who" style="margin:0">
        <button class="chip on" data-w="all">Everything</button>
        <button class="chip" data-w="everyone">Everyone</button>
        <button class="chip" data-w="warehouse">Warehouse</button>
        <button class="chip" data-w="transportation">Transportation</button>
        <button class="chip" data-w="managers">Managers</button>
        <button class="chip" data-w="hr">HR</button>
        <button class="chip" data-w="customers">Customers</button>
      </div>
      <span class="hint-key">☆ Star a tile to pin it to the top — saved on this device.</span>
    </div>
    <div class="hub-bar" style="margin-top:-6px">
      <div class="chips" id="show" style="margin:0">
        <button class="chip on" data-s="all">Apps + Sites</button>
        <button class="chip" data-s="apps">📲 Apps only</button>
        <button class="chip" data-s="sites">🌐 Sites &amp; Links only</button>
      </div>
      <button class="how" id="howInstall">How do I install an app?</button>
    </div>

    <div id="favWrap"></div>
    <div id="sections"></div>
    <div class="empty" id="none" hidden><div class="e">🔍</div>Nothing matches that search.</div>
  </main>

  <footer class="footer">Logistics Warehouse, Inc. · 700 Fresno Street, Fort Smith, AR · 1-479-410-2611</footer>

  <script src="links.js?v=1.2.0"></script>
  <script src="assets/js/common.js?v=1.2.0"></script>
  <script src="assets/js/hub.js?v=1.2.0"></script>
</body>
</html>
